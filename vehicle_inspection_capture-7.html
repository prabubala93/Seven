<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VI Capture">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Vehicle Inspection Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#10151b;
    --panel:#171e26;
    --panel-2:#1d2530;
    --line:#293240;
    --accent:#FF6B35;
    --accent-dim:#5c2c14;
    --teal:#2DD4BF;
    --text:#EDEEF0;
    --text-dim:#8B97A3;
    --danger:#E5484D;
    --radius:12px;
    --disp:'Oswald', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
  body{-webkit-tap-highlight-color:transparent;padding-bottom:32px;}
  ::selection{background:var(--accent);color:#10151b;}

  header{padding:18px 16px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,21,27,0.96);backdrop-filter:blur(6px);z-index:20;}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:8px;height:8px;background:var(--accent);display:inline-block;transform:rotate(45deg);}
  h1{font:600 22px/1.15 var(--disp);letter-spacing:.01em;margin:6px 0 0;text-transform:uppercase;}
  .reset-link{position:absolute;top:18px;right:16px;font:500 11px var(--mono);color:var(--text-dim);background:none;border:1px solid var(--line);padding:6px 10px;border-radius:20px;letter-spacing:.04em;}

  main{padding:16px;max-width:520px;margin:0 auto;}

  .field-label{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;display:block;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}

  #vehicleNumber{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--accent);font:600 20px var(--mono);letter-spacing:.08em;padding:12px 12px;text-transform:uppercase;}
  #vehicleNumber:focus{outline:none;border-color:var(--accent);}
  #vehicleNumber::placeholder{color:#495261;font-weight:500;}
  .hint{font:400 10.5px var(--mono);color:var(--text-dim);margin-top:6px;}

  .loc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .gate-panel{text-align:center;border-color:var(--accent);}
  .gate-icon{font-size:26px;margin-bottom:6px;}
  .gate-title{font:600 14px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .gate-text{font:400 12px/1.6 var(--mono);color:var(--text-dim);margin-bottom:12px;}
  .gate-btn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--accent);color:#1a0d05;font:600 13px var(--disp);letter-spacing:.04em;text-transform:uppercase;}
  .grid.locked{opacity:0.3;pointer-events:none;filter:grayscale(0.6);}
  .loc-text{font:400 11.5px/1.6 var(--mono);color:var(--text-dim);flex:1;}
  .loc-text b{color:var(--text);font-weight:500;}
  .loc-text .ps{color:var(--teal);}
  #refreshLoc{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:500 10px var(--mono);letter-spacing:.05em;white-space:nowrap;}
  #refreshLoc:active{border-color:var(--accent);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .card{position:relative;}
  .cap-btn{width:100%;aspect-ratio:1/1;background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--radius);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
  .cap-btn:active{border-color:var(--accent);}
  .cap-btn.filled{border-style:solid;border-color:var(--teal);}
  .cap-num{position:absolute;top:8px;left:9px;font:600 10px var(--mono);color:var(--text-dim);letter-spacing:.08em;}
  .cap-btn.filled .cap-num{color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2;}
  .cap-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  .cap-btn.filled .cap-thumb{display:block;}
  .cap-icon{font:400 26px var(--disp);color:var(--text-dim);margin-bottom:6px;}
  .cap-label{font:600 11px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);z-index:2;}
  .cap-btn.filled .cap-label{position:absolute;bottom:8px;left:9px;right:9px;color:#fff;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.7);font-size:10.5px;}
  .cap-check{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#0a1410;font:700 12px var(--disp);align-items:center;justify-content:center;display:none;z-index:2;}
  .cap-btn.filled .cap-check{display:flex;}
  .cap-btn.flagged{border-color:var(--danger);}
  .cap-btn.flagged .cap-check{background:var(--danger);color:#fff;}

  .actions{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .action-btn{width:100%;padding:15px 14px;border-radius:var(--radius);border:none;font:600 13px var(--disp);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
  .action-btn small{display:block;font:400 10px var(--mono);letter-spacing:0;text-transform:none;opacity:.75;margin-top:2px;}
  .action-btn .lbl{text-align:left;}
  #btnPdf{background:var(--accent);color:#1a0d05;}
  #btnZip{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .action-btn:disabled{opacity:.4;}
  .action-btn .arrow{font-size:16px;}

  #status{font:500 11.5px var(--mono);color:var(--text-dim);min-height:16px;padding:4px 2px;letter-spacing:.02em;}
  #status.busy{color:var(--accent);}
  #status.ok{color:var(--teal);}

  .progress-count{font:600 10px var(--mono);color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .progress-count b{color:var(--teal);}

  footer{text-align:center;padding:20px 16px 4px;font:400 10px var(--mono);color:#4a5462;letter-spacing:.04em;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Field Documentation Tool</div>
  <h1>Vehicle Inspection Capture</h1>
  <button class="reset-link" onclick="resetAll()">New</button>
</header>

<main>

  <div class="panel">
    <span class="field-label">Vehicle Registration Number</span>
    <input id="vehicleNumber" type="text" placeholder="e.g. MH12CQ9142" autocapitalize="characters" autocomplete="off">
    <div class="hint">Used to name every exported file.</div>
  </div>

  <div class="panel" id="locPanel" style="display:none;">
    <div class="loc-row">
      <div class="loc-text" id="locText"><b>Locating…</b></div>
      <button id="refreshLoc" onclick="initLocation()">↻ Refresh</button>
    </div>
  </div>

  <div class="panel gate-panel" id="locGate">
    <div class="gate-icon">📍</div>
    <div class="gate-title">Location Required</div>
    <div class="gate-text" id="gateText">Requesting your location…</div>
    <button class="gate-btn" onclick="initLocation()">Try Again</button>
  </div>

  <div class="progress-count">Captured: <b id="progressCount">0</b> / 6</div>
  <div class="grid" id="grid"></div>

  <div class="actions">
    <button class="action-btn" id="btnPdf" onclick="generateCombinedPDF()">
      <span class="lbl">Combined PDF<small>All photos · one file · &lt; 2 MB</small></span>
      <span class="arrow">→</span>
    </button>
    <button class="action-btn" id="btnZip" onclick="generateIndividualZip()">
      <span class="lbl">Individual Photos<small>6 files zipped · &lt; 500 KB each</small></span>
      <span class="arrow">→</span>
    </button>
  </div>

  <div id="status"></div>

</main>

<footer>Photos stay on this device until you export them.</footer>

<script>
const LABELS = [
  {key:'front',   title:'FRONT'},
  {key:'rear',    title:'REAR'},
  {key:'left',    title:'LEFT SIDE'},
  {key:'right',   title:'RIGHT SIDE'},
  {key:'speedo',  title:'SPEEDOMETER'},
  {key:'chassis', title:'CHASSIS NO.'},
];

const state = {
  vehicleNumber: '',
  photos: {},      // key -> { raw: canvas (unstamped), capturedAt: Date }
  thumbUrls: {},    // key -> object URL (for revoke)
  location: null,   // { lat, lon, address }
  policeStation: null, // { name, distance, distanceLabel }
  addressStatus: 'idle',  // idle | loading | done | error
  policeStatus: 'idle',   // idle | loading | done | error
  busy: false,
};

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 12000);
  try{
    return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
  } finally {
    clearTimeout(t);
  }
}

async function waitForLocationSettled(maxMs){
  const start = Date.now();
  while(Date.now() - start < maxMs){
    if(state.addressStatus !== 'loading' && state.policeStatus !== 'loading') return;
    await sleep(300);
  }
}

// ---------- Setup ----------
document.getElementById('vehicleNumber').addEventListener('input', e=>{
  state.vehicleNumber = e.target.value.toUpperCase();
  e.target.value = state.vehicleNumber;
});

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  LABELS.forEach((l, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${l.key}`;
    card.innerHTML = `
      <span id="file-slot-${l.key}"></span>
      <button class="cap-btn" id="btn-${l.key}" type="button">
        <span class="cap-num">${String(i+1).padStart(2,'0')}</span>
        <img class="cap-thumb" alt="${l.title}">
        <span class="cap-icon">▣</span>
        <span class="cap-label">${l.title}</span>
        <span class="cap-check">✓</span>
      </button>`;
    grid.appendChild(card);
    card.querySelector('.cap-btn').addEventListener('click', ()=> triggerCapture(l.key));
  });
}

// iOS Safari can show a black/frozen camera screen if the same <input type=file>
// element is reused across multiple captures. Creating a brand-new input each
// time (and discarding it right after) avoids that stale-picker state.
function triggerCapture(key){
  if(state.busy) return;
  if(!state.location){
    renderLocationGate();
    const gate = document.getElementById('locGate');
    if(gate) gate.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const slot = document.getElementById(`file-slot-${key}`);
  slot.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.hidden = true;
  input.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) handleCapture(key, file);
    input.remove();
  });
  slot.appendChild(input);
  input.click();
}

// ---------- Status helpers ----------
function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}
function setBusy(v){
  state.busy = v;
  document.getElementById('btnPdf').disabled = v;
  document.getElementById('btnZip').disabled = v;
}
function updateProgress(){
  const count = LABELS.filter(l=>state.photos[l.key]).length;
  document.getElementById('progressCount').textContent = count;
}
function sanitize(s){
  return (s||'VEHICLE').trim().toUpperCase().replace(/[^A-Z0-9]/g,'_').replace(/_+/g,'_') || 'VEHICLE';
}

// ---------- Location + nearest police station ----------
function setLocText(html){ document.getElementById('locText').innerHTML = html; }

function setGateText(msg){
  const gateText = document.getElementById('gateText');
  if(gateText) gateText.textContent = msg;
}

// Shows/hides the "Location Required" gate and locks/unlocks the capture grid.
// Camera buttons stay disabled (and triggerCapture bails out) until state.location is set.
function renderLocationGate(){
  const gate = document.getElementById('locGate');
  const panel = document.getElementById('locPanel');
  const grid = document.getElementById('grid');
  if(state.location){
    gate.style.display = 'none';
    panel.style.display = '';
    grid.classList.remove('locked');
  } else {
    gate.style.display = '';
    panel.style.display = 'none';
    grid.classList.add('locked');
  }
}

let locationPollTimer = null;
function stopLocationPoll(){
  if(locationPollTimer){ clearInterval(locationPollTimer); locationPollTimer = null; }
}

// Once the phone's location is off, we don't make the person tap anything —
// we quietly keep checking every few seconds and unlock the moment it's back on.
// Uses a relaxed accuracy/timeout so a weak indoor GPS signal doesn't look like "still off".
function startLocationPoll(){
  stopLocationPoll();
  locationPollTimer = setInterval(()=>{
    if(state.location){ stopLocationPoll(); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      resolveLocation(pos.coords.latitude, pos.coords.longitude, 'gps');
    }, err=>{
      if(err.code === 1){
        // Permission was blocked for this page specifically — toggling the phone's
        // Location setting can't fix that, so stop polling and say so plainly.
        stopLocationPoll();
        setGateText('Location access is blocked for this page. Reload the page and tap Allow when asked.');
      }
      // otherwise (still off / weak signal) — keep waiting silently
    }, { enableHighAccuracy:false, timeout:10000, maximumAge:20000 });
  }, 4000);
}

async function initLocation(){
  stopLocationPoll();
  state.location = null;
  state.policeStation = null;
  state.addressStatus = 'idle';
  state.policeStatus = 'idle';
  renderLocationGate();
  setGateText('Requesting your location…');

  if(!navigator.geolocation){
    setGateText('This device does not support location.');
    return;
  }
  if(!window.isSecureContext){
    setGateText('Please open this tool from its hosted link (not a saved local copy).');
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    resolveLocation(pos.coords.latitude, pos.coords.longitude, 'gps');
  }, err=>{
    if(err.code === 1){
      setGateText('Location access is blocked for this page. Reload the page and tap Allow when asked.');
    } else {
      setGateText('Turn on Location for this device — this will unlock automatically once it\'s on.');
      startLocationPoll();
    }
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:60000 });
}

function resolveLocation(lat, lon, source){
  stopLocationPoll();
  state.location = { lat, lon, address: null, source };
  state.addressStatus = 'loading';
  state.policeStatus = 'loading';
  renderLoc();
  renderLocationGate();
  refreshAllThumbnails();

  reverseGeocode(lat, lon).then(addr=>{
    state.location.address = addr;
    state.addressStatus = 'done';
    renderLoc();
    refreshAllThumbnails();
  }).catch(()=>{
    state.addressStatus = 'error';
    renderLoc();
    refreshAllThumbnails();
  });

  findNearestPolice(lat, lon).then(ps=>{
    state.policeStation = ps;
    state.policeStatus = 'done';
    renderLoc();
    refreshAllThumbnails();
  }).catch(()=>{
    state.policeStatus = 'error';
    renderLoc();
    refreshAllThumbnails();
  });
}

function renderLoc(){
  const loc = state.location;
  if(!loc) return;
  const badge = loc.source === 'ip'
    ? ' <span style="color:var(--accent)">· approx. (network-based, GPS unavailable)</span>'
    : '';
  let html = `<b>${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}</b>${badge}`;
  if(state.addressStatus === 'loading') html += '<br>Resolving address…';
  else if(state.addressStatus === 'error') html += '<br>Address lookup failed (tap Refresh to retry)';
  else if(loc.address) html += `<br>${loc.address}`;

  if(state.policeStatus === 'loading') html += '<br>Nearest PS: resolving…';
  else if(state.policeStatus === 'error') html += '<br>Nearest PS: lookup failed (tap Refresh to retry)';
  else if(state.policeStation) html += `<br><span class="ps">Nearest PS: ${state.policeStation.name} (${state.policeStation.distanceLabel})</span>`;
  else if(state.policeStatus === 'done') html += '<br>Nearest PS: none found nearby';

  setLocText(html);
}

async function reverseGeocode(lat, lon){
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=16`;
  const res = await fetchWithTimeout(url, { headers:{ 'Accept':'application/json' } }, 12000);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data.display_name || null;
}

const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];

async function overpassQuery(q){
  let lastErr;
  for(const endpoint of OVERPASS_ENDPOINTS){
    try{
      const url = endpoint + '?data=' + encodeURIComponent(q);
      const res = await fetchWithTimeout(url, {}, 12000);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Overpass lookup failed');
}

async function findNearestPolice(lat, lon){
  const radii = [5000, 15000, 30000];
  let sawError = false;
  for(const r of radii){
    const q = `[out:json][timeout:15];node["amenity"="police"](around:${r},${lat},${lon});out;`;
    try{
      const data = await overpassQuery(q);
      if(data.elements && data.elements.length){
        let best = null, bestD = Infinity;
        for(const el of data.elements){
          const d = haversine(lat, lon, el.lat, el.lon);
          if(d < bestD){ bestD = d; best = el; }
        }
        const name = (best.tags && best.tags.name) ? best.tags.name : 'Police Station';
        return { name, distance: bestD, distanceLabel: bestD < 1000 ? `${Math.round(bestD)} m` : `${(bestD/1000).toFixed(1)} km` };
      }
    }catch(e){ sawError = true; }
  }
  if(sawError) throw new Error('Police lookup failed');
  return null;
}

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ---------- Capture + watermark ----------
function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

function drawResized(img, maxDim){
  const { width:w, height:h } = img;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
  return canvas;
}

function fmtDate(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ---------- EXIF capture-time check (catches gallery / old photo uploads) ----------
// The "capture" attribute on the file input only *hints* the browser toward the
// camera app — it can't fully block someone from backing out to the gallery.
// Reading the photo's own embedded EXIF timestamp and comparing it to "now" is
// the reliable way to catch a photo that wasn't just taken live.

function readIFDEntries(view, ifdOffset, little){
  const count = view.getUint16(ifdOffset, little);
  const entries = [];
  for(let i=0;i<count;i++){
    const eo = ifdOffset + 2 + i*12;
    entries.push({
      tag: view.getUint16(eo, little),
      type: view.getUint16(eo+2, little),
      numValues: view.getUint32(eo+4, little),
      valueOffset: eo+8
    });
  }
  return entries;
}

function readAsciiValue(view, tiffStart, entry, little){
  const dataOffset = entry.numValues <= 4 ? entry.valueOffset : tiffStart + view.getUint32(entry.valueOffset, little);
  let str = '';
  for(let i=0; i<entry.numValues-1; i++) str += String.fromCharCode(view.getUint8(dataOffset+i));
  return str;
}

function findExifDateString(view, tiffStart, ifdOffset, little){
  const entries = readIFDEntries(view, ifdOffset, little);
  for(const e of entries){
    if((e.tag === 0x9003 || e.tag === 0x0132) && e.type === 2) return readAsciiValue(view, tiffStart, e, little);
  }
  for(const e of entries){
    if(e.tag === 0x8769){
      const subOffset = tiffStart + view.getUint32(e.valueOffset, little);
      const subEntries = readIFDEntries(view, subOffset, little);
      for(const se of subEntries){
        if((se.tag === 0x9003 || se.tag === 0x9004) && se.type === 2) return readAsciiValue(view, tiffStart, se, little);
      }
    }
  }
  return null;
}

function parseExifDateStr(s){
  const m = (s||'').trim().match(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return null;
  const [, y, mo, d, h, mi, se] = m.map(Number);
  return new Date(y, mo-1, d, h, mi, se);
}

async function getExifCaptureDate(file){
  try{
    const buf = await file.slice(0, 131072).arrayBuffer();
    const view = new DataView(buf);
    if(view.getUint16(0, false) !== 0xFFD8) return null;
    let offset = 2;
    while(offset + 4 <= view.byteLength){
      const marker = view.getUint16(offset, false);
      if((marker & 0xFF00) !== 0xFF00) break;
      if(marker === 0xFFDA || marker === 0xFFD9) break;
      const segLength = view.getUint16(offset+2, false);
      if(marker === 0xFFE1){
        const exifStart = offset+4;
        if(exifStart+6 <= view.byteLength && view.getUint32(exifStart, false) === 0x45786966){
          const tiffStart = exifStart+6;
          const little = view.getUint16(tiffStart, false) === 0x4949;
          const firstIFDRel = view.getUint32(tiffStart+4, little);
          const dateStr = findExifDateString(view, tiffStart, tiffStart+firstIFDRel, little);
          if(dateStr) return parseExifDateStr(dateStr);
        }
      }
      offset += 2 + segLength;
    }
  }catch(e){ /* unreadable/corrupt EXIF — treat as no date found */ }
  return null;
}

function buildWatermarkLines(title, capturedAt, flagReason){
  const vn = state.vehicleNumber || 'UNSPECIFIED';
  const lines = [];
  lines.push(`${vn}   ·   ${title}`);
  lines.push(fmtDate(capturedAt || new Date()));
  if(flagReason === 'gallery-old'){
    lines.push('⚠ GALLERY IMPORT — NOT A LIVE CAPTURE');
  } else if(flagReason === 'no-exif'){
    lines.push('⚠ Capture time unverified (no camera metadata)');
  }
  if(state.location){
    const approx = state.location.source === 'ip' ? ' (approx.)' : '';
    lines.push(`${state.location.lat.toFixed(5)}, ${state.location.lon.toFixed(5)}${approx}`);
    if(state.addressStatus === 'loading') lines.push('Resolving address…');
    else if(state.location.address) lines.push(state.location.address);
  } else {
    lines.push('Location unavailable');
  }
  if(state.policeStation){
    lines.push(`Nearest PS: ${state.policeStation.name} (${state.policeStation.distanceLabel})`);
  } else if(state.policeStatus === 'loading'){
    lines.push('Nearest PS: resolving…');
  } else {
    lines.push('Nearest PS: unavailable');
  }
  return lines;
}

function wrapLine(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return [text];
  const words = text.split(' ');
  const out = []; let cur = '';
  for(const w of words){
    const trial = cur ? cur + ' ' + w : w;
    if(ctx.measureText(trial).width > maxWidth && cur){ out.push(cur); cur = w; }
    else cur = trial;
  }
  if(cur) out.push(cur);
  return out;
}

function stampWatermark(canvas, title, capturedAt, flagReason){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pad = Math.max(10, Math.round(w * 0.022));
  const baseFont = Math.max(12, Math.round(w * 0.026));
  const rawLines = buildWatermarkLines(title, capturedAt, flagReason);

  ctx.font = `${baseFont}px 'JetBrains Mono', monospace`;
  const maxTextWidth = w - pad*2;
  let lines = [];
  rawLines.forEach((line, i) => {
    const isWarn = line.startsWith('⚠');
    ctx.font = i===0 ? `600 ${Math.round(baseFont*1.05)}px 'JetBrains Mono', monospace` : `${baseFont}px 'JetBrains Mono', monospace`;
    wrapLine(ctx, line, maxTextWidth).forEach(seg => lines.push({ text: seg, head: i===0, warn: isWarn }));
  });

  const lh = Math.round(baseFont * 1.42);
  const barH = pad*2 + lines.length * lh;

  const grad = ctx.createLinearGradient(0, h - barH, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.4, 'rgba(0,0,0,0.72)');
  grad.addColorStop(1, 'rgba(0,0,0,0.86)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, h - barH, w, barH);

  ctx.textBaseline = 'top';
  let y = h - barH + pad;
  lines.forEach(l => {
    ctx.font = l.head ? `600 ${Math.round(baseFont*1.05)}px 'JetBrains Mono', monospace` : `${baseFont}px 'JetBrains Mono', monospace`;
    ctx.fillStyle = l.warn ? '#FFC24B' : (l.head ? '#FF6B35' : '#FFFFFF');
    ctx.fillText(l.text, pad, y);
    y += lh;
  });

  // corner accent tick, top-left — red if flagged, orange otherwise
  ctx.fillStyle = flagReason === 'gallery-old' ? 'rgba(229,72,77,0.95)' : 'rgba(255,107,53,0.9)';
  ctx.fillRect(0, 0, Math.max(3, Math.round(w*0.006)), h);
}

async function handleCapture(key, file){
  setStatus(`Checking ${key}…`, 'busy');
  try{
    const now = new Date();
    const exifDate = await getExifCaptureDate(file);
    let capturedAt = now;
    let flagReason = null;

    if(exifDate){
      const diffMs = Math.abs(now - exifDate);
      if(diffMs > 5 * 60 * 1000){
        flagReason = 'gallery-old';
        capturedAt = exifDate;
        const proceed = window.confirm(
          `This photo's own camera timestamp is ${fmtDate(exifDate)} — not right now. It looks like it was picked from the gallery rather than captured live.\n\n` +
          `If you continue, it will be clearly marked "GALLERY IMPORT" with its real timestamp, not the current time.\n\nContinue anyway?`
        );
        if(!proceed){ setStatus(`${key} capture cancelled`, ''); return; }
      } else {
        capturedAt = exifDate;
      }
    } else {
      flagReason = 'no-exif';
    }

    const img = await loadImageFromFile(file);
    const raw = drawResized(img, 1280);
    state.photos[key] = { raw, capturedAt, flagReason };
    await refreshThumbnail(key);
    updateProgress();
    const title = LABELS.find(l=>l.key===key).title;
    if(flagReason === 'gallery-old'){
      setStatus(`${title} captured — ⚠ flagged as a gallery import`, '');
    } else if(!state.location){
      setStatus(`${title} captured — location not ready yet, will update automatically`, '');
    } else {
      setStatus(`${title} captured`, 'ok');
    }
  }catch(e){
    setStatus(`Could not process photo: ${e.message}`, '');
  }
}

// Produces a fresh stamped copy using the CURRENT location/police-station data,
// so a photo taken before those resolved still gets updated once they arrive.
function getStampedCanvas(key){
  const rec = state.photos[key];
  if(!rec) return null;
  const clone = document.createElement('canvas');
  clone.width = rec.raw.width; clone.height = rec.raw.height;
  clone.getContext('2d').drawImage(rec.raw, 0, 0);
  const title = LABELS.find(l=>l.key===key).title;
  stampWatermark(clone, title, rec.capturedAt, rec.flagReason);
  return clone;
}

async function refreshThumbnail(key){
  const stamped = getStampedCanvas(key);
  if(!stamped) return;
  const thumbBlob = await canvasToBlob(stamped, 'image/jpeg', 0.6);
  if(state.thumbUrls[key]) URL.revokeObjectURL(state.thumbUrls[key]);
  const thumbUrl = URL.createObjectURL(thumbBlob);
  state.thumbUrls[key] = thumbUrl;
  const btn = document.getElementById(`btn-${key}`);
  btn.querySelector('.cap-thumb').src = thumbUrl;
  btn.classList.add('filled');
  const flagged = state.photos[key].flagReason === 'gallery-old';
  btn.classList.toggle('flagged', flagged);
  btn.querySelector('.cap-check').textContent = flagged ? '!' : '✓';
}

function refreshAllThumbnails(){
  Object.keys(state.photos).forEach(key => refreshThumbnail(key));
}

// ---------- Compression ----------
function canvasToBlob(canvas, type, quality){
  return new Promise(res => canvas.toBlob(res, type, quality));
}

function scaleCanvas(canvas, factor){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(canvas.width * factor));
  c.height = Math.max(1, Math.round(canvas.height * factor));
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}

async function compressCanvasToTarget(canvas, maxBytes, startQuality){
  let quality = startQuality || 0.88;
  let working = canvas;
  let blob = await canvasToBlob(working, 'image/jpeg', quality);
  let attempts = 0;
  while(blob.size > maxBytes && attempts < 14){
    attempts++;
    if(quality > 0.4){
      quality = Math.round((quality - 0.08) * 100) / 100;
    } else {
      working = scaleCanvas(working, 0.82);
      quality = 0.7;
    }
    blob = await canvasToBlob(working, 'image/jpeg', quality);
  }
  return { blob, canvas: working };
}

function blobToDataURL(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

// ---------- Export: combined PDF (< 2MB) ----------
async function makeSinglePDF(blob, canvas){
  const dataUrl = await blobToDataURL(blob);
  const { jsPDF } = window.jspdf;
  const ratio = canvas.width / canvas.height;
  const pageW = 190;
  const pageH = Math.max(40, pageW / ratio);
  const doc = new jsPDF({ unit:'mm', format:[pageW, pageH] });
  doc.addImage(dataUrl, 'JPEG', 0, 0, pageW, pageH);
  return doc.output('blob');
}

async function assembleCombinedPDF(compressedMap, keys){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  for(let i=0; i<keys.length; i++){
    const key = keys[i];
    const { blob, canvas } = compressedMap[key];
    const dataUrl = await blobToDataURL(blob);
    if(i>0) doc.addPage();
    const pageW = 210, pageH = 297, margin = 8, topReserve = 16;
    const availW = pageW - margin*2, availH = pageH - topReserve - margin;
    const ratio = canvas.width / canvas.height;
    let w = availW, h = w / ratio;
    if(h > availH){ h = availH; w = h * ratio; }
    const x = (pageW - w)/2, y = topReserve + (availH - h)/2;
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.setTextColor(30,30,30);
    doc.text(`${state.vehicleNumber || 'VEHICLE'}  —  ${LABELS.find(l=>l.key===key).title}`, margin, 11);
    doc.addImage(dataUrl, 'JPEG', x, y, w, h);
  }
  return doc.output('blob');
}

async function generateCombinedPDF(){
  const keys = LABELS.map(l=>l.key).filter(k => state.photos[k]);
  if(!state.vehicleNumber){ setStatus('Enter the vehicle number first', ''); return; }
  if(!keys.length){ setStatus('Capture at least one photo first', ''); return; }
  setBusy(true);
  try{
    if(state.addressStatus === 'loading' || state.policeStatus === 'loading'){
      setStatus('Waiting for location / police-station lookup to finish…', 'busy');
      await waitForLocationSettled(8000);
    }
    const TARGET = 2_000_000, SAFE = 1_880_000;
    let budget = Math.floor(SAFE / keys.length);
    let compressed = {};
    for(const k of keys){
      setStatus(`Compressing ${k}…`, 'busy');
      compressed[k] = await compressCanvasToTarget(getStampedCanvas(k), budget);
    }
    setStatus('Building PDF…', 'busy');
    let pdfBlob = await assembleCombinedPDF(compressed, keys);
    let tries = 0;
    while(pdfBlob.size > TARGET && tries < 4){
      tries++;
      budget = Math.floor(budget * 0.72);
      for(const k of keys){
        setStatus(`Re-compressing ${k} (pass ${tries})…`, 'busy');
        compressed[k] = await compressCanvasToTarget(getStampedCanvas(k), budget);
      }
      pdfBlob = await assembleCombinedPDF(compressed, keys);
    }
    downloadBlob(pdfBlob, `${sanitize(state.vehicleNumber)}_inspection.pdf`);
    setStatus(`Done — ${keys.length} photos, ${(pdfBlob.size/1024/1024).toFixed(2)} MB`, 'ok');
  }catch(e){
    setStatus(`PDF generation failed: ${e.message}`, '');
  }finally{
    setBusy(false);
  }
}

// ---------- Export: individual photos zipped (< 500 KB each) ----------
async function generateIndividualZip(){
  const keys = LABELS.map(l=>l.key).filter(k => state.photos[k]);
  if(!state.vehicleNumber){ setStatus('Enter the vehicle number first', ''); return; }
  if(!keys.length){ setStatus('Capture at least one photo first', ''); return; }
  setBusy(true);
  try{
    if(state.addressStatus === 'loading' || state.policeStatus === 'loading'){
      setStatus('Waiting for location / police-station lookup to finish…', 'busy');
      await waitForLocationSettled(8000);
    }
    const zip = new JSZip();
    let total = 0;
    for(const k of keys){
      setStatus(`Compressing ${k}…`, 'busy');
      const { blob: jpegBlob, canvas } = await compressCanvasToTarget(getStampedCanvas(k), 500_000);
      const pdfBlob = await makeSinglePDF(jpegBlob, canvas);
      let finalBlob, ext;
      if(pdfBlob.size < jpegBlob.size && pdfBlob.size <= 500_000){
        finalBlob = pdfBlob; ext = 'pdf';
      } else {
        finalBlob = jpegBlob; ext = 'jpg';
      }
      total += finalBlob.size;
      zip.file(`${sanitize(state.vehicleNumber)}_${k}.${ext}`, finalBlob);
    }
    setStatus('Building zip…', 'busy');
    const zipBlob = await zip.generateAsync({ type:'blob' });
    downloadBlob(zipBlob, `${sanitize(state.vehicleNumber)}_photos.zip`);
    setStatus(`Done — ${keys.length} files, ${(total/1024/1024).toFixed(2)} MB total`, 'ok');
  }catch(e){
    setStatus(`Export failed: ${e.message}`, '');
  }finally{
    setBusy(false);
  }
}

// ---------- Reset ----------
function resetAll(){
  if(!Object.keys(state.photos).length && !state.vehicleNumber){ return; }
  if(!confirm('Start a new inspection? This clears the current vehicle number and all captured photos.')) return;
  Object.values(state.thumbUrls).forEach(u => URL.revokeObjectURL(u));
  state.photos = {}; state.thumbUrls = {}; state.vehicleNumber = '';
  document.getElementById('vehicleNumber').value = '';
  buildGrid();
  updateProgress();
  setStatus('');
}

// ---------- Init ----------
buildGrid();
updateProgress();
initLocation();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline install just won't be available */ });
  });
}
